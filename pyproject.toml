[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenttelemetry"
version = "0.2.0"
description = "OpenTelemetry-based observability for autonomous AI agent systems"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Krishna Chaitanya Balusu" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "opentelemetry-api >= 1.20.0",
    "opentelemetry-sdk >= 1.20.0",
    "opentelemetry-instrumentation >= 0.41b0",
]

[project.urls]
Homepage = "https://github.com/Krishnachaitanyakc/AgentTelemetry"
Repository = "https://github.com/Krishnachaitanyakc/AgentTelemetry"
Issues = "https://github.com/Krishnachaitanyakc/AgentTelemetry/issues"

[project.optional-dependencies]
langchain = ["langchain-core >= 0.2.0"]
crewai = ["crewai >= 1.0.0"]
autogen = ["autogen-agentchat >= 0.4.0"]
anthropic = ["anthropic >= 0.20.0"]
openai = ["openai >= 1.0.0"]
llamaindex = ["llama-index-core >= 0.10.0"]
inspect = ["inspect-ai >= 0.3.246"]
all = ["agenttelemetry[langchain,crewai,autogen,anthropic,openai,llamaindex]"]
dev = ["pytest >= 8.0", "pytest-asyncio", "pytest-mock"]

# PEP 735 groups: `uv sync` installs the dev group by default, which is how
# the inspect_evals register expects `uv sync` to yield a runnable eval.
[dependency-groups]
dev = [
    "pytest >= 8.0",
    "pytest-asyncio",
    "pytest-mock",
    "inspect-ai >= 0.3.246",
    "langchain-core >= 0.2.0",
]

[project.entry-points.inspect_ai]
agenttelemetry_inspect = "agenttelemetry_inspect"

[tool.hatch.build.targets.wheel]
packages = ["src/agenttelemetry", "src/agenttelemetry_inspect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
